# El MISMO gate que corre el agente. No se mergea en rojo.
# La señal `hermes plugins doctor` sale OMITIDA acá (no hay Hermes): omitido no es verde, y el
# resumen del gate lo dice.
name: ci
on:
  push:
  pull_request:
jobs:
  gate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python scripts/gate.py
