# El MISMO gate que corre el agente, en CI. No se mergea en rojo.
# La señal `hermes plugins doctor` sale OMITIDA acá (no hay Hermes): omitido no es verde.
name: harness
on:
  push:
  pull_request:
jobs:
  gate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python .hermes/harness/scripts/gate.py
