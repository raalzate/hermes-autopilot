name: repo-harness
version: "1.0.0"
description: "Arnés de repo para Hermes: frenos declarados en .hermes/harness.config.json (terminal, rutas protegidas, patrones, memoria, skills, cron), lint del archivo tocado, presupuesto de lo aprobado, secretos tapados en la respuesta, gate pendiente al cerrar el turno y estado verificado al abrir la sesión. Genérico: sin config en el repo, no hace nada."
author: "hermes-autopilot"
provides_hooks:
  - pre_tool_call
  - post_tool_call
  - transform_tool_result
  - transform_llm_output
  - pre_verify
  - pre_llm_call
